<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리가 함께한 시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#22303C; --ink-soft:#5B6772; --line:#D9DDD8;
  --accent:#3F6E6A; --accent-ink:#FFFFFF; --shadow:rgba(34,48,60,.14);
  --serif:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161C21; --surface:#1F272E; --ink:#ECEFEC; --ink-soft:#A2ADB6; --line:#33404A;
    --accent:#7FB5AF; --accent-ink:#10201F; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#161C21; --surface:#1F272E; --ink:#ECEFEC; --ink-soft:#A2ADB6; --line:#33404A;
  --accent:#7FB5AF; --accent-ink:#10201F; --shadow:rgba(0,0,0,.5);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,48px);line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink-soft);font-size:18px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.years{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:36px 0 8px;border-bottom:1px solid var(--line)}
.year{background:none;border:0;border-bottom:4px solid transparent;padding:6px 14px 10px;font-family:var(--serif);font-size:clamp(22px,4.4vw,32px);color:var(--ink-soft);margin-bottom:-1px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.year small{font-family:var(--sans);font-size:13px;margin-top:2px;opacity:.8}
.year[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.year:hover{color:var(--ink)}
.note{text-align:center;font-family:var(--serif);font-size:20px;margin:26px auto 4px;max-width:640px}
.grid{columns:3 260px;column-gap:22px;margin-top:28px}
.print{break-inside:avoid;margin:0 0 26px;background:var(--surface);padding:10px 10px 14px;border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 16px -8px var(--shadow);cursor:pointer;display:block;width:100%;text-align:left}
.print .m{position:relative;background:var(--line);line-height:0;min-height:80px}
.print img,.print video{width:100%;height:auto;display:block}
.print .badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:1;padding:6px 10px;border-radius:999px}
.print .cap{font-family:var(--serif);font-size:16px;line-height:1.6;margin:12px 4px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.print .dt{margin:4px 4px 0;font-size:13px;color:var(--ink-soft)}
.empty{text-align:center;color:var(--ink-soft);padding:70px 10px;font-size:18px}
.lb{position:fixed;inset:0;z-index:50;background:#0E1316;color:#F1F3F1;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb.open{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.lb-top .count{color:#B9C2C8;font-size:15px}
.lb button.ic{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;min-width:46px;height:46px;padding:0 16px;font-size:16px}
.lb button.ic:hover{background:rgba(255,255,255,.2)}
.lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 56px}
.lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:26px;border-radius:10px}
.nav:hover{background:rgba(255,255,255,.2)}
.nav.prev{left:4px}.nav.next{right:4px}
.lb-info{padding:14px 20px 22px;text-align:center;max-height:38vh;overflow:auto}
.lb-cap{font-family:var(--serif);font-size:clamp(19px,3.4vw,26px);line-height:1.6;max-width:760px;margin:0 auto;white-space:pre-wrap}
.lb-dt{color:#B9C2C8;font-size:15px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;z-index:80;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:560px){.lb-stage{padding:0 4px}.nav{width:40px;height:56px;opacity:.75}.wrap{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="actions">
      <button class="btn primary" id="playAll">슬라이드쇼로 보기</button>
    </div>
  </header>
  <nav class="years" id="years" role="tablist" aria-label="카테고리 선택"></nav>
  <div class="note" id="note"></div>
  <section id="content"></section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lb-top">
    <span class="count" id="lbCount"></span>
    <span style="display:flex;gap:8px">
      <button class="ic" id="lbPlay" aria-label="자동 재생">▶ 자동 재생</button>
      <button class="ic" id="lbClose" aria-label="닫기">닫기</button>
    </span>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="nav prev" id="lbPrev" aria-label="이전">&#8249;</button>
    <div id="lbMedia" style="display:contents"></div>
    <button class="nav next" id="lbNext" aria-label="다음">&#8250;</button>
  </div>
  <div class="lb-info" id="lbInfo"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- 사진 목록: make_photos.py 가 만들어 줍니다 -->
<script src="photos.js" ver="0.0.1"></script>
<script>
(function(){
  var A=window.ALBUM;
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2800)}

  if(!A){
    document.querySelector('.wrap').innerHTML='<div class="empty">photos.js 를 찾지 못했어요.<br>make_photos.py 를 먼저 실행해 주세요.</div>';
    return;
  }

  var YEARS=['2022','2023','2024','2025','2026','Wedding'];
  function cname(c){return /^\d{4}$/.test(c)?c+'년':c}
  function fmtDate(d){if(!d)return '';var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?(m[1]+'년 '+Number(m[2])+'월 '+Number(m[3])+'일'):d}
  function srcUrl(p){return p.src.split('/').map(encodeURIComponent).join('/')}

  var photos=(A.photos||[]).filter(function(p){return YEARS.indexOf(p.year)>-1});
  function byYear(y){return photos.filter(function(p){return p.year===y})}
  function allSorted(){return YEARS.reduce(function(a,y){return a.concat(byYear(y))},[])}

  var state={year:YEARS.filter(function(y){return byYear(y).length})[0]||YEARS[0],list:[],idx:0,playing:false,timer:null};

  document.title=A.title||'앨범';
  $('title').textContent=A.title||'';
  $('sub').textContent=A.sub||'';

  function renderYears(){
    var nav=$('years');nav.textContent='';
    YEARS.forEach(function(y){
      var b=el('button','year');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(y===state.year));
      b.append(document.createTextNode(y));
      var n=byYear(y).length;b.append(el('small',null,n?(n+'장'):'—'));
      b.onclick=function(){state.year=y;render()};
      nav.append(b);
    });
  }
  function renderNote(){$('note').textContent=(A.notes&&A.notes[state.year])||''}
  function renderContent(){
    var c=$('content');c.textContent='';
    var list=byYear(state.year);
    if(!list.length){c.append(el('div','empty',cname(state.year)+' 사진을 준비 중이에요.'));return}
    var g=el('div','grid');
    list.forEach(function(p,i){
      var card=el('div','print');
      card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',(p.caption||'사진')+' 크게 보기');
      var m=el('div','m');
      if(p.type==='video'){
        var v=document.createElement('video');v.src=srcUrl(p)+'#t=0.1';v.preload='metadata';v.muted=true;v.playsInline=true;m.append(v,el('span','badge','▶ 영상'));
      }else{
        var im=document.createElement('img');im.src=srcUrl(p);im.alt=p.caption||'';im.loading='lazy';im.decoding='async';
        im.onerror=function(){m.textContent='불러올 수 없어요'};
        m.append(im);
      }
      card.append(m);
      if(p.caption)card.append(el('div','cap',p.caption));
      if(p.date)card.append(el('div','dt',fmtDate(p.date)));
      card.onclick=function(){openLB(list,i)};
      card.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLB(list,i)}};
      g.append(card);
    });
    c.append(g);
  }
  function render(){renderYears();renderNote();renderContent()}

  /* lightbox */
  function openLB(list,i){state.list=list;state.idx=i;$('lb').classList.add('open');document.body.style.overflow='hidden';showLB();$('lbClose').focus()}
  function closeLB(){stopPlay();$('lb').classList.remove('open');document.body.style.overflow='';var v=$('lbMedia').querySelector('video');if(v)v.pause();$('lbMedia').textContent=''}
  function showLB(){
    var p=state.list[state.idx];if(!p){closeLB();return}
    var media=$('lbMedia');media.textContent='';
    var node;
    if(p.type==='video'){
      node=document.createElement('video');node.src=srcUrl(p);node.controls=true;node.playsInline=true;
      node.onended=function(){if(state.playing)step(1)};
      if(state.playing){node.play().catch(function(){node.muted=true;node.play().catch(function(){})})}
    }else{
      node=document.createElement('img');node.src=srcUrl(p);node.alt=p.caption||'';
    }
    media.append(node);
    $('lbCount').textContent=cname(p.year)+' · '+(state.idx+1)+' / '+state.list.length;
    var info=$('lbInfo');info.textContent='';
    if(p.caption)info.append(el('p','lb-cap',p.caption));
    if(p.date)info.append(el('div','lb-dt',fmtDate(p.date)));
    $('lbPrev').style.visibility=$('lbNext').style.visibility=state.list.length>1?'visible':'hidden';
    if(state.playing&&p.type!=='video')schedule();
  }
  function step(d){var n=state.list.length;if(!n)return;state.idx=(state.idx+d+n)%n;showLB()}
  function schedule(){clearTimeout(state.timer);state.timer=setTimeout(function(){step(1)},6500)}
  function startPlay(){state.playing=true;$('lbPlay').textContent='⏸ 멈춤';showLB()}
  function stopPlay(){state.playing=false;clearTimeout(state.timer);$('lbPlay').textContent='▶ 자동 재생'}
  $('lbPlay').onclick=function(){state.playing?stopPlay():startPlay()};
  $('lbPrev').onclick=function(){step(-1)};
  $('lbNext').onclick=function(){step(1)};
  $('lbClose').onclick=closeLB;
  $('playAll').onclick=function(){
    var all=allSorted();
    if(!all.length){toast('아직 사진이 없어요.');return}
    state.list=all;state.idx=0;$('lb').classList.add('open');document.body.style.overflow='hidden';startPlay();
  };
  document.addEventListener('keydown',function(e){
    if(!$('lb').classList.contains('open'))return;
    if(e.key==='Escape')closeLB();
    if(e.key==='ArrowRight')step(1);
    if(e.key==='ArrowLeft')step(-1);
  });
  var tx=null;
  $('lbStage').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  $('lbStage').addEventListener('touchend',function(e){
    if(tx==null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;
    if(Math.abs(dx)>50)step(dx<0?1:-1);
  },{passive:true});

  render();
})();
</script>
</body>
</html>
